<!doctype html>
<html lang="en" data-theme="dark" data-accent="city">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkmate</title>
  <link rel="icon" href="/app-icon">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="console">
    <a class="brand" href="/" id="brand">
      <span class="brand-mark" id="brand-mark">♞</span>
      <span class="brand-name" id="brand-name">Checkmate</span>
      <span class="brand-co" id="brand-co"></span>
    </a>
    <ol class="steps" id="steps" aria-label="Progress">
      <li data-step="who"><i></i>You</li>
      <li data-step="repo"><i></i>Repository</li>
      <li data-step="profile"><i></i>Scan</li>
      <li data-step="scan"><i></i>Running</li>
      <li data-step="outcome"><i></i>Outcome</li>
    </ol>
    <div class="console-right">
      <button type="button" class="chip" id="tenant-chip" hidden><i></i><span>Checkmarx One</span></button>
      <button type="button" class="chip" id="city-chip" hidden><span>📍 Choose your city</span></button>
      <span class="chip" id="version-chip" style="cursor:default"><span class="ver" id="version"></span></span>
    </div>
  </header>

  <main id="app" class="stage" aria-live="polite"></main>
  <footer class="footer"><span id="footer-left"></span><span>Powered by Checkmarx One · Fusion</span></footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
