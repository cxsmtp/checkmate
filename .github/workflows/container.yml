name: Container image

# Every push and pull request: build the image, check its file list, start it hardened and
# smoke-test it. Pushes to main (and v* tags) then publish it for linux/amd64 and linux/arm64:
#   ghcr.io/<owner>/<repo>:latest, :<version>, :sha-<commit>
# and sign both the file list and the image (GitHub build attestation, logged by Sigstore).
# Running containers with auto-update on pick the new version up within minutes, check every
# file against this signed list, and switch to it (rolling back by themselves if it fails).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg APP_VERSION=0.0.${{ github.run_number }} --build-arg APP_COMMIT=${{ github.sha }} --build-arg APP_REPOSITORY=${{ github.repository }} -t checkmate:test .
      - name: The file list matches the image
        run: |
          docker run --rm --entrypoint node checkmate:test scripts/integrity.mjs check
          docker create --name cm-files checkmate:test > /dev/null
          docker cp cm-files:/app/integrity.json integrity.json
          docker rm cm-files > /dev/null
          grep -q '"repository": "${{ github.repository }}"' integrity.json
      - name: Start hardened, turn healthy, sign in, register
        run: |
          docker run -d --name cm -p 3333:3333 -v cm-data:/data \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true checkmate:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cm)" = healthy ] && break
            sleep 2
          done
          docker logs cm
          test "$(docker inspect -f '{{.State.Health.Status}}' cm)" = healthy
          # Started by the launcher, so updates and rollbacks work from the admin panel.
          docker logs cm 2>&1 | grep -q '\[launch\] Starting v0.0.${{ github.run_number }}'
          curl -sf http://127.0.0.1:3333/api/health | grep -q '"version":"0.0.${{ github.run_number }}"'
          # The first admin password is printed once and works.
          PW=$(docker exec cm cat /data/first-admin-password.txt)
          docker logs cm 2>&1 | grep -qF "Password: $PW"
          curl -sf -H 'Content-Type: application/json' -d "{\"password\":\"$PW\"}" http://127.0.0.1:3333/api/admin/login | grep -q '"signedIn":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3333/api/admin/updates)" = 401
          # No package manager in the runtime image; nothing in /app is writable.
          if docker exec cm sh -c 'command -v npm || command -v npx || command -v yarn'; then echo 'package manager in image'; exit 1; fi
          if docker exec cm sh -c 'touch /app/src/x 2>/dev/null'; then echo '/app is writable'; exit 1; fi
          # Security headers.
          curl -sfI http://127.0.0.1:3333/ | grep -qi "content-security-policy: .*frame-ancestors 'none'"
          curl -sfI http://127.0.0.1:3333/ | grep -qi 'x-frame-options: DENY'
          # A visitor picks a sample repository (demo mode) and gets results.
          SAMPLE=$(curl -sf http://127.0.0.1:3333/api/config | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).samples[0].id))")
          RES=$(curl -sf -H 'Content-Type: application/json' -d "{\"name\":\"CI\",\"email\":\"ci@example.com\",\"technicalName\":\"CI\",\"technicalEmail\":\"ci@example.com\",\"contacts\":[{\"name\":\"A\",\"email\":\"a@example.com\"},{\"name\":\"B\",\"email\":\"b@example.com\"}],\"sampleId\":\"$SAMPLE\",\"inviteNow\":false}" http://127.0.0.1:3333/api/sessions)
          SID=$(echo "$RES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).id))")
          KEY=$(echo "$RES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).accessKey))")
          URL="/api/sessions/$SID?k=$KEY"
          # The scan profile is read from the tenant (demo options here); the visitor then chooses and starts.
          for i in $(seq 1 15); do curl -sf "http://127.0.0.1:3333$URL" | grep -q '"stage":"profile"' && break; sleep 1; done
          curl -sf "http://127.0.0.1:3333$URL" | grep -q '"models":\['
          curl -sf -H 'Content-Type: application/json' -d "{\"k\":\"$KEY\",\"fusion\":true,\"llmModel\":\"opus-5.5\"}" "http://127.0.0.1:3333/api/sessions/$SID/start" | grep -q '"stage":"queued"'
          for i in $(seq 1 40); do curl -sf "http://127.0.0.1:3333$URL" | grep -q '"stage":"complete"' && break; sleep 2; done
          curl -sf "http://127.0.0.1:3333$URL" | grep -q '"fusionOnly":\['
          # The outcome completes itself: AI Triage, then AI Remediation, on the Fusion-only findings.
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:3333$URL" | grep -q '"vulnerable":' && break; sleep 2; done
          curl -sf "http://127.0.0.1:3333$URL" | grep -q '"vulnerable":4'
          for i in $(seq 1 40); do curl -sf "http://127.0.0.1:3333$URL" | grep -q '"fixed":4' && break; sleep 2; done
          curl -sf "http://127.0.0.1:3333$URL" | grep -q '"fixed":4'
          # Stops cleanly through tini.
          docker stop cm > /dev/null
          docker logs cm 2>&1 | grep -q 'Stopped cleanly'

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing: the file list and the image get a GitHub build attestation (Sigstore, public log).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every push to main is a release: major.minor from package.json, patch = this workflow's run number.
      - id: version
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
          labels: |
            io.checkmate.version=${{ steps.version.outputs.version }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_REPOSITORY=${{ github.repository }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The file list the server checks itself against: the same bytes on both platforms, then signed.
      - name: The file list, identical on amd64 and arm64
        id: files
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          index=$(docker buildx imagetools inspect --raw "$image@${{ steps.build.outputs.digest }}")
          for arch in amd64 arm64; do
            digest=$(echo "$index" | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            test -n "$digest"
            id=$(docker create --platform "linux/$arch" "$image@$digest")
            docker cp "$id:/app/integrity.json" "integrity-$arch.json"
            docker rm "$id" > /dev/null
          done
          cmp integrity-amd64.json integrity-arm64.json
          cp integrity-amd64.json integrity.json
          sha256sum integrity.json
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # GitHub signs builds of public repositories, and of private ones only on Enterprise Cloud
      # (set the repository variable ATTESTATIONS=on there). Unsigned releases still publish, but
      # running containers refuse to auto-update to them until they are signed.
      - name: Releases cannot be signed in this repository
        if: github.event.repository.visibility != 'public' && vars.ATTESTATIONS != 'on'
        run: |
          msg="Not signed: GitHub does not sign builds of private repositories owned by a user. The image is published, but containers will refuse to auto-update to it. Make the repository public (or use an Enterprise Cloud organisation and set ATTESTATIONS=on)."
          echo "::warning title=Release not signed::$msg"
          echo "### ⚠️ Release not signed" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the file list
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS == 'on'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: integrity.json
      - name: Sign the image
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS == 'on'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.files.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
